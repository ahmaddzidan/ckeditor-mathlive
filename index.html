<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKEditor 5 with MathLive</title>
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="build/ckeditor_classic.js"></script>
    <style>
        .ck-wordcount {
            width: 100%;
            box-sizing: border-box;
            font-size: 13px;
            padding: 6px 10px;
            background: #fff;
            /* sama dengan background editor */
            border: 1px solid #ddd;
            border-top: none;
            /* hilangkan garis atas */
            border-radius: 0 0 6px 6px;
            /* sudut bawah menyatu */
            color: #333;
            display: flex;
            justify-content: flex-end;
            /* teks rata kanan */
            gap: 16px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <textarea id="editor"></textarea>
    <script>
        ClassicEditor
            .create(document.querySelector('#editor'), {
                licenseKey: 'GPL',
            })
            .catch(error => {
                console.error(error);
            });

    </script>
</body>

</html>
